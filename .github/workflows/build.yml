name: DllBuild
on:
  push:
    branches:
      - master
      - 'issues/**'
      - 'work/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        compiler: [ldc-1.43.0, ldc-latest]

    steps:
    - name: Get source
      uses: actions/checkout@v4

    - uses: dlang-community/setup-dlang@v1.4.0
      with:
        compiler: ${{ matrix.compiler }}

    - name: Cache dub
      uses: actions/cache@v4
      with:
        path: ~/.dub
        key: ${{ runner.os }}-dub-${{ matrix.compiler }}-${{ hashFiles('**/dub.json', '**/dub.selections.json') }}
        restore-keys: |
          ${{ runner.os }}-dub-${{ matrix.compiler }}-
          ${{ runner.os }}-dub-

    - name: Build
      run: make all

    - name: Test
      run: make test
